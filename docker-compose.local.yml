services:
  gemini-web2api:
    build: .
    container_name: gemini-web2api
    ports:
      # Loopback on the host: without an api_keys entry, publishing on every
      # interface would hand your Google session to the whole LAN.
      - "127.0.0.1:8081:8081"
    volumes:
      - ./config.json:/app/config.json
    restart: unless-stopped
